<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f7f9;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #012c1f, #001b12);
            color: white;
            padding: 30px 15px;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .menu-title {
            font-size: 12px;
            color: #7c8b85;
            letter-spacing: 2px;
            margin: 25px 10px 15px;
            text-transform: uppercase;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #d1d5db;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #073926;
            color: white;
        }

        .sidebar i {
            font-size: 18px;
        }

        .admin-box {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.03);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #4f46e5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .main {
            margin-left: 260px;
            min-height: 100vh;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page {
            padding: 30px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-weight: 700;
        }

        .page-title p {
            color: #6b7280;
        }

        .form-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            max-width: 950px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
        }

        .form-control,
        .form-select {
            padding: 11px 13px;
            border-radius: 10px;
            border-color: #d1d5db;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #013220;
            box-shadow: 0 0 0 0.2rem rgba(1, 50, 32, 0.12);
        }

        .btn-theme {
            background: #013220;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
        }

        .btn-theme:hover {
            background: #024d30;
            color: white;
        }

        .btn-back {
            text-decoration: none;
            color: #013220;
            font-weight: 600;
        }

        .btn-back:hover {
            color: #024d30;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }

            .sidebar span,
            .menu-title,
            .brand,
            .admin-box div:last-child {
                display: none;
            }

            .main {
                margin-left: 80px;
            }

            .page {
                padding: 15px;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

    <div class="brand">
        <i class="bi bi-hospital"></i>
        Hospital Admin
    </div>

    <div class="menu-title">Menu</div>

    <a href="{% url 'HospitalAdmin_Dashboard' %}">
        <i class="bi bi-grid"></i>
        <span>Dashboard</span>
    </a>

    <a href="{% url 'doctors_list' %}" class="active">
        <i class="bi bi-person-badge"></i>
        <span>Doctors</span>
    </a>

    <a href="#">
        <i class="bi bi-people"></i>
        <span>Patients</span>
    </a>

    <a href="#">
        <i class="bi bi-person-workspace"></i>
        <span>Receptionist</span>
    </a>

    <div class="menu-title">Pages</div>

    <a href="#">
        <i class="bi bi-gear"></i>
        <span>Settings</span>
    </a>

    <div class="admin-box">
        <div class="profile">A</div>
        <div>
            <strong>Administrator</strong>
            <small class="text-secondary d-block">admin@email.com</small>
        </div>
    </div>

</div>

<!-- Main Area -->
<div class="main">

    <div class="header">
        <h5 class="mb-0">Doctor Management</h5>

        <div>
            <i class="bi bi-bell fs-5 me-3"></i>
            <i class="bi bi-person-circle fs-5"></i>
        </div>
    </div>

    <div class="page">

        <div class="page-title">
            <a href="{% url 'doctors_list' %}" class="btn-back">
                <i class="bi bi-arrow-left"></i> Back to Doctors
            </a>

            <h2 class="mt-3">Edit Doctor Details</h2>
            <p>View the doctor's information in the form below.</p>
        </div>

        <div class="form-card">

            <div class="d-flex align-items-center gap-2 mb-4">
                <i class="bi bi-person-vcard fs-3" style="color:#013220;"></i>
                <h4 class="mb-0">Doctor Information</h4>
            </div>

            <!-- Display-only form: no data is saved -->
            <form onsubmit="return false;">

                <div class="row g-4">

                    <div class="col-md-6">
                        <label class="form-label">Doctor ID</label>
                        <input type="text" class="form-control"
                               placeholder="{{ doctor.id }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Doctor Name</label>
                        <input type="text" class="form-control"
                               placeholder="{{ doctor.name }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Specialization</label>
                        <input type="text" class="form-control"
                               placeholder="{{ doctor.specialization }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control"
                               placeholder="{{ doctor.department }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contact Number</label>
                        <input type="text" class="form-control"
                               placeholder="{{ doctor.contact }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <input type="text" class="form-control"
                               placeholder="{{ doctor.status }}" readonly>
                    </div>

                </div>

                <div class="mt-4 d-flex justify-content-end">
                    <a href="{% url 'doctors_list' %}"
                       class="btn btn-theme">
                        <i class="bi bi-arrow-left"></i>
                        Back to Doctors
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
