
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCore | Login</title>

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-page">

    <header class="site-header">
        <a href="#" class="brand">
            <div class="brand-icon">✚</div>
            <div class="brand-text">
                <h1>Medi<span>Core</span></h1>
                <p>Hospital Management System</p>
            </div>
        </a>

        <div class="header-tagline">
            Better Care <span>•</span> Healthier Tomorrow
        </div>
    </header>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">✚</div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Please login to your account to continue</p>
            </div>

            <form action="#" method="post" id="loginForm">

                {% csrf_token %}

                <div class="form-group">
                    <label for="role">User Role</label>

                    <select id="role" name="role" required>
                        <option value="" selected disabled>
                            Select your role
                        </option>
                        <option value="doctor">Doctor</option>
                        <option value="hospital_admin">
                            Hospital Admin
                        </option>
                        <option value="super_admin">
                            Super Admin
                        </option>
                        <option value="receptionist">
                            Receptionist
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" name="remember_me">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-button">
                    <span>Login to Dashboard</span>
                    <span class="arrow">→</span>
                </button>

            </form>

            <div class="secure-access">
                <span></span>
                <p>✦ &nbsp; Secure Access</p>
                <span></span>
            </div>

        </section>

    </main>

    <footer class="page-footer">
        <p>© 2026 MediCore Hospital Management System</p>
        <p>Authorized Personnel Only</p>
    </footer>

</div>

<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";
        togglePassword.textContent = isHidden ? "Hide" : "Show";

        togglePassword.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
    });
</script>

</body>
</html>
